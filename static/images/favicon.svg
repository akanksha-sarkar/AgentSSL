<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Psyduck</title>
  <g stroke="#3D2B12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- three hair strands -->
    <path d="M30 13 C29 8 27 5 25 3" fill="none"/>
    <path d="M32 12 C32 7 32 5 32 2" fill="none"/>
    <path d="M34 13 C35 8 37 5 39 3" fill="none"/>
    <!-- head -->
    <path d="M32 12 C47 12 56 22 56 35 C56 49 46 58 32 58 C18 58 8 49 8 35 C8 22 17 12 32 12 Z" fill="#F7D348"/>
    <!-- hands clutching the top of the head -->
    <path d="M6 22 C5 15 11 11 17 13 C21 14 22 19 19 22 C16 25 9 27 6 22 Z" fill="#F5C93A"/>
    <path d="M10 15 L13 19 M14 13.5 L16 18" fill="none" stroke-width="1.3"/>
    <path d="M58 22 C59 15 53 11 47 13 C43 14 42 19 45 22 C48 25 55 27 58 22 Z" fill="#F5C93A"/>
    <path d="M54 15 L51 19 M50 13.5 L48 18" fill="none" stroke-width="1.3"/>
