    <path d="M12 43 C12 36 22 35 32 35 C42 35 52 36 52 43 C52 50 43 53 32 53 C21 53 12 50 12 43 Z" fill="#FBEFC4"/>
    <path d="M15 44 C22 46.5 42 46.5 49 44" fill="none" stroke-width="1.4"/>
  </g>
  <!-- blank, dazed eyes -->
  <circle cx="24.5" cy="28" r="4.2" fill="#fff" stroke="#3D2B12" stroke-width="1.5"/>
  <circle cx="39.5" cy="28" r="4.2" fill="#fff" stroke="#3D2B12" stroke-width="1.5"/>
  <circle cx="24.5" cy="28" r="1.2" fill="#1A1A1A"/>
  <circle cx="39.5" cy="28" r="1.2" fill="#1A1A1A"/>
</svg>
